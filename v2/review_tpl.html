<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>字库复核队列</title>
<style>
:root{--bg:#f6f3ec;--card:#fff;--fg:#222;--mut:#777;--ok:#2e7d32;--bad:#c62828;--line:#ddd}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"PingFang SC",sans-serif}
header{position:sticky;top:0;background:var(--bg);padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:2}
header b{font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;padding:12px 16px}
.c{background:var(--card);border:2px solid transparent;border-radius:8px;padding:8px}
.c.ok{border-color:var(--ok)} .c.bad{border-color:var(--bad)}
.pics{display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:6px;overflow:hidden}
.pics .ctx{height:200px;max-width:calc(100% - 100px);object-fit:contain;min-width:0}
.pics figure{flex:0 0 90px}
.pics .one{width:88px;height:88px;object-fit:contain;background:#eee;border:1px dashed #bbb}
.pics figure{margin:0;text-align:center;font-size:11px;color:var(--mut)}
.lab{font-size:28px;font-family:"Kaiti SC","STKaiti",serif}
.meta{color:var(--mut);font-size:12px}
.lv{display:inline-block;padding:0 6px;border-radius:4px;background:#eee;font-size:12px}
.lv.A,.lv.缺字{background:#fde0e0} .lv.废段{background:#fff0c2}
.row{display:flex;gap:6px;margin-top:6px}
button{cursor:pointer;border:1px solid var(--line);background:#fafafa;border-radius:4px;padding:2px 10px}
input{width:60px}
</style>
</head>
<body>
<header>
  <b>字库复核队列</b><span id="cnt"></span>
  <label>等级 <select id="flt"><option value="">全部</option><option>A</option><option>缺字</option><option>废段</option><option>B</option><option>C</option></select></label>
  <button id="exp">导出 corrections.json</button>
  <span class="meta">按原帖顺序排列（页 → 页内字序）。左：上下文，红框 = 当前字；右：入库单字图。对：标签正确；错：可在框里填正确字（留空 = 该图不是字/应丢弃）</span>
</header>
<div class="grid" id="g"></div>
<script>
const ROWS = /*DATA*/[];
let st = {};
try { st = JSON.parse(localStorage.getItem('rv') || '{}') } catch (e) {}
const save = () => { try { localStorage.setItem('rv', JSON.stringify(st)) } catch (e) {} };
function render() {
  const f = document.getElementById('flt').value;
  const g = document.getElementById('g'); g.innerHTML = '';
  const rs = ROWS.filter(r => !f || r.level === f);
  document.getElementById('cnt').textContent = `${rs.length} 条，已判 ${rs.filter(r => st[r.key]).length}`;
  for (const r of rs) {
    const s = st[r.key] || {};
    const d = document.createElement('div');
    d.className = 'c ' + (s.v || '');
    d.innerHTML = `${r.img ? `<div class="pics"><img class="ctx" loading="lazy" src="${r.img}"><figure><img class="one" loading="lazy" src="${r.single}"><figcaption>入库单字图<br>${r.size}</figcaption></figure></div>` : '<div class="meta" style="height:60px">（图上未找到该字）</div>'}
      <span class="lab">${r.char || '—'}</span> <span class="lv ${r.level}">${r.level}</span>
      <div class="meta">${r.key} 列${r.col}　p=${r.p ?? '-'}　cons=${r.cons ?? '-'}<br>识别: ${r.top}</div>
      <div class="row"><button data-v="ok">对</button><button data-v="bad">错</button>
      <input placeholder="改为" value="${s.fix || ''}"></div>`;
    d.querySelectorAll('button').forEach(b => b.onclick = () => {
      st[r.key] = { ...s, v: b.dataset.v, fix: d.querySelector('input').value }; save(); render();
    });
    d.querySelector('input').onchange = e => { st[r.key] = { ...s, v: 'bad', fix: e.target.value }; save(); render(); };
    g.appendChild(d);
  }
}
document.getElementById('flt').onchange = render;
document.getElementById('exp').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(st, null, 1)], { type: 'application/json' }));
  a.download = 'corrections.json'; a.click();
};
render();
</script>
</body>
</html>
