<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>书法字库</title>
<style>
  :root {
    --paper: #f5efe0; --paper2: #ece3cd; --ink: #3a3128; --ink2: #7a6d5a;
    --accent: #a53f2b; --line: #d8c9a5; --ok: #2e7d32;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--paper); color: var(--ink);
         font-family: "Songti SC", "STSong", "Kaiti SC", serif; min-height: 100vh; }
  header { padding: 14px 24px 10px; border-bottom: 2px solid var(--line); background: var(--paper2); }
  header h1 { font-size: 22px; letter-spacing: 2px; }
  header .sub { font-size: 12px; color: var(--ink2); margin-top: 3px; }
  nav { display: flex; gap: 6px; margin-top: 10px; }
  nav button {
    font-family: inherit; font-size: 15px; padding: 7px 20px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--ink2); border-radius: 4px 4px 0 0;
  }
  nav button.on { background: #fff; color: var(--accent); font-weight: 700; border-bottom-color: #fff; }
  main { padding: 18px 24px 60px; }
  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px;
         font-size: 14px; }
  .bar select, .bar input[type=text] {
    font-family: inherit; font-size: 14px; padding: 6px 10px;
    border: 1px solid var(--line); border-radius: 4px; background: #fff;
  }
  .bar input[type=text] { width: 280px; }
  .btn { font-family: inherit; font-size: 14px; padding: 6px 16px; cursor: pointer;
         background: var(--accent); color: #fff; border: 0; border-radius: 4px; }
  .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .hint { font-size: 12px; color: var(--ink2); }
  .grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .cell { width: 108px; background: #fff; border: 1px solid var(--line); border-radius: 4px;
          padding: 4px; text-align: center; cursor: pointer; }
  .cell img { width: 100px; height: 100px; object-fit: contain; display: block; }
  .cell .cap { font-size: 12px; color: var(--ink2); line-height: 1.5; }
  .cell .cap b { color: var(--ink); font-size: 15px; }
  .qchar { margin: 10px 14px 10px 0; display: inline-block; vertical-align: top; text-align: center; }
  .qchar .ch { font-size: 26px; margin-bottom: 4px; }
  .qchar .miss { width: 100px; height: 100px; border: 1px dashed #c66; color: #c66;
                 display: flex; align-items: center; justify-content: center; font-size: 12px; }
  .variants img { width: 92px; height: 92px; border: 1px solid var(--line); margin: 2px;
                  background: #fff; cursor: zoom-in; }
  /* 字帖 */
  #copyArea { display: flex; flex-wrap: wrap; gap: 0; background: #fff; padding: 14px;
              border: 1px solid var(--line); width: fit-content; }
  .mig { width: var(--gsz); height: var(--gsz); position: relative; margin: 2px; }
  .mig .frame { position: absolute; inset: 0; border: 1px solid #d66; pointer-events: none; }
  .mig .frame::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0;
        border-left: 1px dashed #e9a0a0; }
  .mig .frame::after { content: ""; position: absolute; top: 50%; left: 0; right: 0;
        border-top: 1px dashed #e9a0a0; }
  .mig .d1 { position: absolute; inset: 0; pointer-events: none;
        background: linear-gradient(to top right, transparent calc(50% - .5px), #eec2c2 calc(50% - .5px), #eec2c2 calc(50% + .5px), transparent calc(50% + .5px)); }
  .mig .d2 { position: absolute; inset: 0; pointer-events: none;
        background: linear-gradient(to bottom right, transparent calc(50% - .5px), #eec2c2 calc(50% - .5px), #eec2c2 calc(50% + .5px), transparent calc(50% + .5px)); }
  .mig img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity .15s; }
  .mig.ok img { opacity: 1; }
  .mig .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;   /* 字圖未到時的淡色佔位 */
        color: #e6dccb; font-size: calc(var(--gsz) * .5); }
  .mig.ok .ph { display: none; }
  .mig .miss { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #c66; font-size: 11px; }
  #modal { position: fixed; inset: 0; background: rgba(40,30,10,.72); display: none;
           align-items: center; justify-content: center; z-index: 50; flex-direction: column; }
  #modal.show { display: flex; }
  #modal img { max-width: 60vmin; max-height: 60vmin; background: #fff; border-radius: 6px; }
  #modal .meta { color: #f0e8d0; margin-top: 12px; font-size: 15px; }
  .missList { font-size: 13px; color: #b33; margin-top: 10px; }
  /* 字帖工具列 */
  .copybar { flex-direction: column; align-items: stretch; gap: 8px; max-width: 760px; }
  .copybar .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .copybar .sels select { flex: 1 1 220px; min-width: 0; }
  #cText { width: 100%; font-family: inherit; font-size: 16px; padding: 10px;
           border: 1px solid var(--line); border-radius: 4px; }
  .opts label { white-space: nowrap; }
  .size { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  /* 手機：全寬、無橫向捲動、字圖格按螢幕寬排 */
  html { -webkit-text-size-adjust: 100%; }
  img { max-width: 100%; }
  @media (max-width: 640px) {
    header { padding: 12px 16px 0; }
    header h1 { font-size: 20px; }
    nav button { flex: 1; padding: 8px 0; font-size: 15px; }
    main { padding: 12px 16px 48px; }
    .bar { gap: 8px; }
    .bar select, .bar input[type=text] { width: 100%; font-size: 16px; padding: 8px 10px; }
    .bar .btn { flex: 1; padding: 9px 8px; }
    .copybar .sels select { flex-basis: 100%; }
    .grid { gap: 8px; display: grid; grid-template-columns: repeat(3, 1fr); }
    .cell { width: auto; }
    .cell img { width: 100%; height: auto; aspect-ratio: 1; }
    .variants img { width: 72px; height: 72px; }
    .qchar { margin-right: 8px; }
    #copyArea { width: 100%; padding: 8px; }
    .hint { width: 100%; }
    .opts .hint { width: auto; }
  }
  @media print {
    header, nav, .bar, .hint, #modal, .missList { display: none !important; }
    main { padding: 0; }
    #copyArea { border: 0; width: 100%; }
    body { background: #fff; }
  }
</style>
</head>
<body>
<header>
  <h1>書法字庫</h1>
  <div class="sub" id="sub"></div>
  <nav>
    <button data-v="browse" class="on">全部瀏覽</button>
    <button data-v="query">按字查詢</button>
    <button data-v="copy">生成字帖</button>
  </nav>
</header>

<main>
  <!-- 浏览 -->
  <section id="v-browse">
    <div class="bar">
      <select id="bWork"></select>
      <span class="hint" id="bInfo"></span>
    </div>
    <div class="grid" id="bGrid"></div>
  </section>

  <!-- 查询 -->
  <section id="v-query" style="display:none">
    <div class="bar">
      <select id="qWork"></select>
      <input type="text" id="qInput" placeholder="輸入單字或一段文字（支持簡體）">
      <button class="btn" onclick="doQuery()">查詢</button>
      <span class="hint">輸入多字時逐字列出各自的全部字圖</span>
    </div>
    <div id="qOut"></div>
  </section>

  <!-- 字帖 -->
  <section id="v-copy" style="display:none">
    <div class="bar copybar">
      <div class="row sels">
        <select id="cWork"></select>
        <select id="cScope" title="集字範圍"></select>
      </div>
      <textarea id="cText" rows="4"
        placeholder="在此輸入文章，點擊生成。缺字會以紅字標出並列出清單。"></textarea>
      <div class="row btns">
        <button class="btn" onclick="genCopy()">生成臨摹字帖</button>
        <button class="btn ghost" onclick="genCopy(true)" title="每個字重新隨機挑一張">換一批</button>
        <button class="btn ghost" onclick="window.print()">列印 / PDF</button>
      </div>
      <div class="bar opts" style="margin:0;">
        格式：
        <label><input type="radio" name="gf" value="mi" checked> 米字格</label>
        <label><input type="radio" name="gf" value="jiu"> 九宮格</label>
        <label><input type="radio" name="gf" value="none"> 空格</label>
        <span class="size">格徑 <input type="range" id="cSize" min="40" max="120" value="84"></span>
        <span class="hint" id="cStat"></span>
        <span class="hint">（點擊單格可換該字的另一張）</span>
      </div>
    </div>
    <div class="missList" id="cMiss" style="display:none"></div>
    <div id="copyArea"></div>
  </section>
</main>

<div id="modal" onclick="this.classList.remove('show')">
  <img id="mImg" alt="">
  <div class="meta" id="mMeta"></div>
</div>

<script src="/*DBSRC*/"></script>
<script>
const DB = window.DB;
const BASE = '/*BASE*/';            // 字圖路徑前綴（網站/ 下的拷貝為 ../）
/* 多作品：三個視圖共用「當前作品」W，任一下拉切換即同步 */
const WORKS = DB.authors.flatMap(a => a.works.map(w => Object.assign(w, {author: a})));
let W, ITEM;
function useWork(key) {
  W = WORKS.find(w => w.key === key) || WORKS[0];
  ITEM = Object.fromEntries(W.items.map(it => [it.id, it]));
  for (const id of ['bWork','qWork','cWork']) document.getElementById(id).value = W.key;
  document.getElementById('sub').textContent =
    `${W.author.name}《${W.title}》· ${W.author.dynasty} · ${W.script}${W.source ? ' · ' + W.source : ''} · ${W.items.length} 字圖 / ${Object.keys(W.idxT).length} 字`
    + (WORKS.length > 1 ? `　（共 ${WORKS.length} 部字帖）` : '');
}
/* 查詢：繁體直接命中；簡體走簡體索引 */
function lookup(ch) {
  if (W.idxT[ch] && W.idxT[ch].length) return W.idxT[ch];
  if (W.idxS[ch] && W.idxS[ch].length) return W.idxS[ch];
  return null;
}
function itemsOf(entries) {
  return entries.map(e => ITEM[e.id]).filter(Boolean);
}

/* ---- 導航 ---- */
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  for (const v of ['browse','query','copy'])
    document.getElementById('v-'+v).style.display = (v === b.dataset.v) ? '' : 'none';
});

/* ---- 下拉 ---- */
for (const id of ['bWork','qWork','cWork']) {
  const sel = document.getElementById(id);
  sel.innerHTML = WORKS.map(w => `<option value="${w.key}">${w.author.name}（${w.author.dynasty}）· ${w.title} · ${w.script}</option>`).join('');
  sel.onchange = () => {
    useWork(sel.value); bPage = 0; renderBrowse();
    if (document.getElementById('qInput').value.trim()) doQuery();
    if (document.getElementById('cText').value.trim()) genCopy();
  };
}

/* ---- 瀏覽 ---- */
const PER = 72;
let bPage = 0;
function renderBrowse() {
  const g = document.getElementById('bGrid');
  const start = bPage * PER;
  const slice = W.items.slice(start, start + PER);
  g.innerHTML = slice.map(it =>
    `<div class="cell" onclick="show('${it.id}','${it.ch}')">
       <img loading="lazy" src="${BASE + it.f}"><div class="cap"><b>${it.ch}</b> · 第${it.page}頁</div>
     </div>`).join('');
  const tp = Math.ceil(W.items.length / PER);
  document.getElementById('bInfo').innerHTML =
    `共 ${W.items.length} 張字圖 · 第 ${bPage+1}/${tp} 頁
     <button class="btn ghost" style="padding:2px 10px" onclick="bPage=Math.max(0,bPage-1);renderBrowse()">‹</button>
     <button class="btn ghost" style="padding:2px 10px" onclick="bPage=Math.min(${tp-1},bPage+1);renderBrowse()">›</button>`;
}

/* ---- 放大 ---- */
function show(id, ch) {
  const it = ITEM[id];
  document.getElementById('mImg').src = BASE + it.f;
  document.getElementById('mMeta').textContent =
    `${ch} · ${W.title} · 第 ${it.page} 頁 · ${it.id}`;
  document.getElementById('modal').classList.add('show');
}

/* ---- 查詢 ---- */
function doQuery() {
  const text = document.getElementById('qInput').value.trim();
  if (!text) return;
  const out = document.getElementById('qOut');
  let html = '', miss = [];
  for (const ch of text) {
    const entries = lookup(ch);
    if (!entries) { miss.push(ch); continue; }
    const its = entries.map(e => ITEM[e.id]).filter(Boolean);
    html += `<div class="qchar"><div class="ch">${ch}${ch !== its[0]?.ch ? '（帖作 ' + its[0]?.ch + '）' : ''}</div>
             <div class="variants">${its.map(it =>
               `<img loading="lazy" src="${BASE + it.f}" title="${it.id} · 第${it.page}頁"
                  onclick="show('${it.id}','${it.ch}')">`).join('')}</div></div>`;
  }
  out.innerHTML = html + (miss.length ? `<p class="missList">字庫未收：${miss.join(' ')}</p>` : '');
}

/* ---- 字帖生成 ----
   集字範圍：本帖，或某書法家同一書體的全部作品（楷、行不混用）。字庫是一字對多圖（不去重），
   每個字從範圍內該字的全部字圖裡隨機挑一張；「換一批」整體重抽，點單格只換該格 */
const ITEMS_OF = Object.fromEntries(WORKS.map(w => [w.key, Object.fromEntries(w.items.map(it => [it.id, it]))]));
const LIBS = [];                        // 集字庫 = 書法家 + 書體：楷、行分庫，同一書家也不混用
for (const w of WORKS) {
  let l = LIBS.find(l => l.author === w.author.name && l.script === w.script);
  if (!l) LIBS.push(l = {id: w.author.name + '·' + w.script, author: w.author.name, script: w.script, works: []});
  l.works.push(w);
}
const cScope = document.getElementById('cScope');
cScope.innerHTML = '<option value="">集字範圍：本帖</option>' + LIBS.map(l =>
  `<option value="${l.id}">按書法家集字：${l.id}（${l.works.length} 部 · ${l.works.reduce((n, w) => n + w.items.length, 0)} 字圖）</option>`).join('');
cScope.onchange = () => { document.getElementById('cWork').disabled = !!cScope.value; prefetch(); if (document.getElementById('cText').value.trim()) genCopy(); };
function pool(ch) {                    // 範圍內該字的全部字圖 [{it, w}]
  const ws = cScope.value ? LIBS.find(l => l.id === cScope.value).works : [W];
  const out = [];
  for (const w of ws) {
    const es = (w.idxT[ch] && w.idxT[ch].length) ? w.idxT[ch] : (w.idxS[ch] || []);
    for (const e of es) { const it = ITEMS_OF[w.key][e.id]; if (it) out.push({it, w}); }
  }
  return out;
}
const rand = a => a[Math.floor(Math.random() * a.length)];
let PICKS = [];                         // 當前字帖每格：{ch, pool, pick}
const srcOf = it => BASE + (it.v || it.f);
function reroll(i) {                    // 只換這一格：新圖載入後再替換，不重畫整帖
  const c = PICKS[i];
  if (c.pool.length < 2) return;
  let p; do p = rand(c.pool); while (p === c.pick); c.pick = p;
  const cell = document.querySelector(`#copyArea .mig[data-i="${i}"]`), img = cell.querySelector('img');
  const pre = new Image();
  pre.onload = pre.onerror = () => { if (c.pick === p) { img.src = pre.src; cell.title = cellTitle(c); } };
  pre.src = srcOf(p.it);
}
function frameHTML(kind) {
  if (kind === 'mi') return '<div class="frame"></div><div class="d1"></div><div class="d2"></div>';
  if (kind === 'jiu') return '<div class="frame"></div><div class="d1"></div><div class="d2"></div><div class="frame" style="inset:25%"></div>';
  return '';
}
/* 預取：輸入停頓 300ms 後先抽好每格字圖並在後臺下載，點「生成」時直接用這一批（圖大多已在快取） */
let PRE = null;                         // {key, picks}
const scopeKey = text => `${cScope.value || W.key}\u0000${text}`;
const cleanText = () => document.getElementById('cText').value.replace(/\s+/g, '');
const drawPicks = text => [...text].map(ch => { const p = pool(ch); return {ch, pool: p, pick: p.length ? rand(p) : null}; });
function prefetch() {
  const text = cleanText();
  if (!text) { PRE = null; return; }
  PRE = {key: scopeKey(text), picks: drawPicks(text)};
  for (const c of PRE.picks) if (c.pick) new Image().src = srcOf(c.pick.it);
}
let preTimer;
document.getElementById('cText').addEventListener('input', () => { clearTimeout(preTimer); preTimer = setTimeout(prefetch, 300); });
function genCopy(fresh) {               // fresh：「換一批」，不用預取的那批
  const text = cleanText();
  PICKS = (!fresh && PRE && PRE.key === scopeKey(text)) ? PRE.picks : drawPicks(text);
  PRE = null;
  renderCopy();
}
const cellTitle = c => `${c.ch} · ${c.pick.w.author.name}《${c.pick.w.title}》第${c.pick.it.page}頁 · ${c.pick.it.id}（共 ${c.pool.length} 張，點擊換一張）`;
function renderCopy() {
  const kind = document.querySelector('input[name=gf]:checked').value;
  const sz = document.getElementById('cSize').value + 'px';
  const area = document.getElementById('copyArea');
  area.style.setProperty('--gsz', sz);
  let html = '', miss = [];
  const used = new Set();
  PICKS.forEach((c, i) => {
    if (c.pick) {
      used.add(c.pick.w.key);
      html += `<div class="mig" data-i="${i}" style="--gsz:${sz};cursor:pointer" onclick="reroll(${i})"
                 title="${cellTitle(c)}">${frameHTML(kind)}<span class="ph">${c.ch}</span><img src="${srcOf(c.pick.it)}" onload="this.parentNode.classList.add('ok')"></div>`;
    } else {
      html += `<div class="mig" style="--gsz:${sz}">${frameHTML(kind)}<div class="miss">缺</div></div>`;
      miss.push(c.ch);
    }
  });
  area.innerHTML = html;
  document.getElementById('cStat').textContent = `共 ${PICKS.length} 格` + (cScope.value ? `，取自 ${used.size} 部作品` : '');
  const ml = document.getElementById('cMiss');
  if (miss.length) { ml.style.display = ''; ml.textContent = '字庫未收（以空格呈現）：' + [...new Set(miss)].join(' '); }
  else ml.style.display = 'none';
}
document.getElementById('cSize').oninput = renderCopy;
document.querySelectorAll('input[name=gf]').forEach(r => r.onchange = renderCopy);

/* init：手機上把格徑設成一行放得下 4 格 */
if (innerWidth < 640) {
  const fit = Math.floor((innerWidth - 32 - 18) / 4) - 4;
  document.getElementById('cSize').value = Math.max(40, Math.min(84, fit));
}
/* init */
useWork(WORKS[0].key);
renderBrowse();
</script>
</body>
</html>
